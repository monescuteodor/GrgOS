# =============================================================================
#  GrgOS — Hyprland configuration
#  Docs: https://wiki.hyprland.org/Configuring/
#  If a directive errors on your Hyprland version, check the wiki — syntax
#  occasionally changes between releases.
# =============================================================================

# ---- Monitors ---------------------------------------------------------------
# Auto-detect; adjust to e.g.  monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor = , preferred, auto, 1

# ---- Programs ---------------------------------------------------------------
$terminal    = kitty
$fileManager = thunar
$menu        = wofi --show drun
$browser     = sh -c 'command -v google-chrome-stable >/dev/null && exec google-chrome-stable --ozone-platform-hint=auto || exec chromium --ozone-platform-hint=auto'

# ---- Environment (dark theme + Wayland hints) -------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = GTK_THEME,Adwaita:dark
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ---- Autostart --------------------------------------------------------------
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Desktop trading widget (pinned live TradingView charts) — see window rules below.
exec-once = grgos-webapp --class grgos-trading file://$HOME/.config/grgos/widgets/trading.html

# ---- Look & feel ------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(1a1b26aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }
}

# ---- Animations (smooth, fluid) ---------------------------------------------
animations {
    enabled = true
    bezier = grgEase,   0.05, 0.9, 0.1, 1.05
    bezier = grgSmooth, 0.16, 1,   0.3, 1
    bezier = grgPop,    0.34, 1.56, 0.64, 1

    animation = windows,     1, 5, grgPop, popin 60%
    animation = windowsOut,  1, 5, grgSmooth, popin 60%
    animation = border,      1, 8, grgEase
    animation = borderangle, 1, 30, grgEase, loop
    animation = fade,        1, 6, grgSmooth
    animation = workspaces,  1, 5, grgSmooth, slidefade 15%
    animation = specialWorkspace, 1, 5, grgPop, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true                 # variable refresh -> lower power when idle
    focus_on_activate = true
}

# ---- Input ------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.4
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# ---- Keybindings ------------------------------------------------------------
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, Space, exec, $menu
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, L, exec, hyprlock

# Screenshots
bind = , Print,       exec, grgos-screenshot region
bind = SHIFT, Print,  exec, grgos-screenshot screen
# Clipboard history
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
# Pomodoro (also clickable on the bar)
bind = $mod, T, exec, grgos-pomodoro toggle

# Focus movement
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scratchpad / special workspace
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ---- Media / hardware keys --------------------------------------------------
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

# ---- Window rules -----------------------------------------------------------
windowrulev2 = float,  class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float,  class:^(org.gnome.Calculator)$
windowrulev2 = float,  title:^(Picture-in-Picture)$
windowrulev2 = pin,    title:^(Picture-in-Picture)$
windowrulev2 = opacity 1.0 override, class:^(google-chrome-stable|chromium|Google-chrome)$

# --- Trading desktop widget ---
# A pinned, borderless floating panel on the right edge that stays visible
# across workspaces. (For a widget that lives *behind* windows on the desktop
# layer, see the eww/ags upgrade note in docs/03.)
windowrulev2 = float,      class:^(grgos-trading)$
windowrulev2 = pin,        class:^(grgos-trading)$
windowrulev2 = noborder,   class:^(grgos-trading)$
windowrulev2 = noshadow,   class:^(grgos-trading)$
windowrulev2 = nofocus,    class:^(grgos-trading)$
windowrulev2 = size 460 950, class:^(grgos-trading)$
windowrulev2 = move 100%-476 56, class:^(grgos-trading)$
