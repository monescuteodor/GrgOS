# GrgOS — hyprlock (lock screen)
background {
    monitor =
    path = /usr/share/grgos/wallpaper.png
    blur_passes = 3
    blur_size = 8
    color = rgba(11, 15, 30, 1.0)
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(122, 162, 247, 0.8)
    inner_color = rgba(26, 27, 38, 0.85)
    font_color = rgba(200, 210, 255, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Enter password…</i>
    hide_input = false
    rounding = 12
    check_color = rgba(158, 206, 106, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(200, 210, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(160, 170, 210, 0.9)
    font_size = 22
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = GrgOS
    color = rgba(122, 162, 247, 0.9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
