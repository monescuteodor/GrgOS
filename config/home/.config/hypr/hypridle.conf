# GrgOS — hypridle (idle management, energy efficient)
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim / prepare after 4 min (placeholder — brightnessctl handles real dimming)
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off after 6 min
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 15 min (laptop-friendly; comment out on a desktop)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
