# GrgOS — tmux (mouse + easy copy-paste; fixes console clipboard pain)
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -sg escape-time 10
set -g renumber-windows on

# Copy-paste:
#   - drag with the touchpad/mouse to select -> auto-copies to the tmux buffer
#   - paste with:  prefix + p   (or the classic prefix + ] )
bind p paste-buffer
# In copy mode (prefix + [): 'v' start selection, 'y' copy, then paste as above
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config:  prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Look
set -g status-style 'bg=#1a1b26 fg=#7aa2f7'
set -g status-left ' #[bold]GrgOS#[nobold] '
set -g status-right ' %H:%M  %d-%b '
setw -g window-status-current-style 'fg=#1a1b26 bg=#7aa2f7 bold'
