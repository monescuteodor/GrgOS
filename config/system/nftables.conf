#!/usr/bin/nft -f
# GrgOS firewall — deny inbound by default, allow outbound.
# Docker-compatible: only the input hook is filtered (published container ports
# traverse the forward path, which Docker manages itself).
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # ICMP (ping / path MTU) — comment out for full stealth
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH (remove this line if you don't want remote SSH access)
        tcp dport 22 accept

        # --- Add server ports here as needed, e.g.: ---
        # tcp dport { 80, 443 } accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
