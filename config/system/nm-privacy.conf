# GrgOS — NetworkManager privacy (installed to /etc/NetworkManager/conf.d/)
[device]
# Randomize MAC while scanning for Wi-Fi (don't leak your real MAC to APs)
wifi.scan-rand-mac-address=yes

[connection]
# Randomize MAC on every connection (Wi-Fi + Ethernet)
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# Privacy-preserving IPv6 addresses
ipv6.ip6-privacy=2

[main]
# Route DNS through systemd-resolved (enables DNS-over-TLS below)
dns=systemd-resolved

[connectivity]
# Don't phone home to check for a captive portal
enabled=false
