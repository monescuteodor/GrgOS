# GrgOS — SSH server hardening (installed to /etc/ssh/sshd_config.d/)
# Password auth stays ON so you don't lock yourself out; switch to keys later
# (ssh-copy-id) and set PasswordAuthentication no for a real server.
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 20
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
PasswordAuthentication yes
PubkeyAuthentication yes
