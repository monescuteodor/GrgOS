# GrgOS — encrypted DNS (installed to /etc/systemd/resolved.conf.d/)
# Quad9 + Cloudflare over TLS. "opportunistic" falls back if a network blocks
# DoT, so you won't lose DNS on captive/restricted networks.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 1.1.1.1#cloudflare-dns.com
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
Cache=yes
